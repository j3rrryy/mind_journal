apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mind-journal.wellness.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: wellness
    {{- include "mind-journal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wellness.replicaCount }}
  selector:
    matchLabels:
      app: wellness
  template:
    metadata:
      labels:
        app: wellness
    spec:
      containers:
      - name: wellness
        image: "{{ .Values.global.image.repository }}:{{ .Values.wellness.image.tag }}"
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.wellness.service.grpcPort }}
          name: grpc
        - containerPort: {{ .Values.wellness.service.httpPort }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "mind-journal.wellness.fullname" . }}-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wellness-postgres
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wellness-redis
              key: password
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.wellness.resources | nindent 10 }}
