apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mind-journal.wellness-worker.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: wellness-worker
    {{- include "mind-journal.labels" . | nindent 4 }}
data:
  {{- range $key, $val := (index .Values "wellness-worker").env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  POSTGRES_HOST: {{ .Release.Name }}-wellness-postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: {{ .Release.Name }}-wellness-redis
  REDIS_PORT: "6379"
