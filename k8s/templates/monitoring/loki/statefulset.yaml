{{- if .Values.monitoring.enabled }}
{{- $lokiName := include "mind-journal.loki.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $lokiName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
    {{- include "mind-journal.labels" . | nindent 4 }}
spec:
  serviceName: {{ $lokiName }}
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: {{ .Values.loki.image }}
        args:
        - -config.file=/etc/loki/loki.yml
        - -config.expand-env=true
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-data
          mountPath: /loki
        resources:
          {{- toYaml .Values.loki.resources | nindent 10 }}
      volumes:
      - name: loki-config
        configMap:
          name: {{ $lokiName }}-config
  volumeClaimTemplates:
  - metadata:
      name: loki-data
      labels:
        {{- include "mind-journal.labels" . | nindent 8 }}
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.loki.storage }}
{{- end }}
