{{- if .Values.monitoring.enabled }}
{{- $prometheusName := include "mind-journal.prometheus.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $prometheusName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "mind-journal.labels" . | nindent 4 }}
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
  type: ClusterIP
{{- end }}
