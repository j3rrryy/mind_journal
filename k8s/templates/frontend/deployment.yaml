apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mind-journal.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    {{- include "mind-journal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.global.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.frontend.service.httpPort }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "mind-journal.frontend.fullname" . }}-config
        startupProbe:
          httpGet:
            path: /api/health/live
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          failureThreshold: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
