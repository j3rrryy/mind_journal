apiVersion: v1
kind: Service
metadata:
  name: {{ include "mind-journal.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "mind-journal.labels" . | nindent 4 }}
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: {{ .Values.gateway.service.httpPort }}
    targetPort: http
  type: ClusterIP
