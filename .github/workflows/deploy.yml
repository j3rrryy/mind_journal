name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        run: |
          TAG_WITHOUT_V=${TAG#v}
          docker build -t ghcr.io/${{ github.repository }}:frontend-$TAG_WITHOUT_V -t ghcr.io/${{ github.repository }}:frontend-latest -f ./src/frontend/Dockerfile ./src/frontend
          docker push ghcr.io/${{ github.repository }}:frontend-$TAG_WITHOUT_V
          docker push ghcr.io/${{ github.repository }}:frontend-latest

  build_backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, wellness, mail]
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        run: |
          TAG_WITHOUT_V=${TAG#v}
          docker build -t ghcr.io/${{ github.repository }}:${{ matrix.service }}-$TAG_WITHOUT_V -t ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest -f ./src/backend/${{ matrix.service }}/Dockerfile ./src/backend/${{ matrix.service }}
          docker push ghcr.io/${{ github.repository }}:${{ matrix.service }}-$TAG_WITHOUT_V
          docker push ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest

  deploy:
    if: ${{ vars.DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - build_frontend
      - build_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config

      - name: Create values-secrets.yaml
        run: |
          cat > k8s/values-secrets.yaml <<EOF
          ingress:
            host: "${{ secrets.PROD_HOST_URL }}"

          frontend:
            env:
              ALLOWED_ORIGINS: "${{ secrets.PROD_ALLOWED_ORIGINS }}"

          auth:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          auth-postgres:
            settings:
              superuserPassword:
                value: "${{ secrets.PROD_DB_PASSWORD }}"
            userDatabase:
              user:
                value: "${{ secrets.PROD_DB_USER }}"
              password:
                value: "${{ secrets.PROD_DB_PASSWORD }}"

          auth-redis:
            redisConfig: |
              requirepass ${{ secrets.PROD_REDIS_PASSWORD }}
              protected-mode no
            auth:
              password: "${{ secrets.PROD_REDIS_PASSWORD }}"

          wellness:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          wellness-worker:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          wellness-postgres:
            settings:
              superuserPassword:
                value: "${{ secrets.PROD_DB_PASSWORD }}"
            userDatabase:
              user:
                value: "${{ secrets.PROD_DB_USER }}"
              password:
                value: "${{ secrets.PROD_DB_PASSWORD }}"

          wellness-redis:
            redisConfig: |
              requirepass ${{ secrets.PROD_REDIS_PASSWORD }}
              protected-mode no
            auth:
              password: "${{ secrets.PROD_REDIS_PASSWORD }}"

          mail:
            env:
              EMAIL_CONFIRMATION_URL: "https://${{ secrets.PROD_HOST_URL }}/auth/confirm-email?token="

          secrets:
            auth:
              SECRET_KEY: "${{ secrets.PROD_AUTH_SECRET_KEY }}"
            mail:
              MAIL_USERNAME: "${{ secrets.PROD_MAIL_USERNAME }}"
              MAIL_PASSWORD: "${{ secrets.PROD_MAIL_PASSWORD }}"
              MAIL_HOSTNAME: "${{ secrets.PROD_MAIL_HOSTNAME }}"
              MAIL_PORT: "${{ secrets.PROD_MAIL_PORT }}"
            grafana:
              GF_SECURITY_ADMIN_USER: "${{ secrets.PROD_GRAFANA_USER }}"
              GF_SECURITY_ADMIN_PASSWORD: "${{ secrets.PROD_GRAFANA_PASSWORD }}"
          EOF

      - name: Deploy with Helm
        run: |
          helm upgrade --install mind-journal ./k8s -f ./k8s/values-prod.yaml -f ./k8s/values-secrets.yaml --namespace mind-journal --create-namespace
          kubectl rollout restart deployment -n mind-journal

      - name: Verify deployment
        run: kubectl rollout status deployment -n mind-journal --timeout=5m
