name: Rollback

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  rollback_frontend:
    if: ${{ vars.DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Get previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - name: Tag the previous Docker image as the latest
        run: |
          PREVIOUS_TAG=${{ steps.previoustag.outputs.tag }}
          PREVIOUS_TAG_WITHOUT_V=${PREVIOUS_TAG#v}

          docker pull ghcr.io/${{ github.repository }}:frontend-$PREVIOUS_TAG_WITHOUT_V
          docker tag ghcr.io/${{ github.repository }}:frontend-$PREVIOUS_TAG_WITHOUT_V ghcr.io/${{ github.repository }}:frontend-latest
          docker push ghcr.io/${{ github.repository }}:frontend-latest

  rollback_backend:
    if: ${{ vars.DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, wellness, mail]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Get previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - name: Tag the previous Docker image as the latest
        run: |
          PREVIOUS_TAG=${{ steps.previoustag.outputs.tag }}
          PREVIOUS_TAG_WITHOUT_V=${PREVIOUS_TAG#v}

          docker pull ghcr.io/${{ github.repository }}:${{ matrix.service }}-$PREVIOUS_TAG_WITHOUT_V
          docker tag ghcr.io/${{ github.repository }}:${{ matrix.service }}-$PREVIOUS_TAG_WITHOUT_V ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest
          docker push ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest

  rollback-deploy:
    if: ${{ vars.DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - rollback_frontend
      - rollback_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config

      - name: Create values-secrets.yaml
        run: |
          cat > k8s/values-secrets.yaml <<EOF
          ingress:
            host: "${{ secrets.PROD_HOST_URL }}"

          frontend:
            env:
              ALLOWED_ORIGINS: "${{ secrets.PROD_ALLOWED_ORIGINS }}"

          auth:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          auth-postgres:
            settings:
              superuserPassword:
                value: "${{ secrets.PROD_DB_PASSWORD }}"
            userDatabase:
              user:
                value: "${{ secrets.PROD_DB_USER }}"
              password:
                value: "${{ secrets.PROD_DB_PASSWORD }}"

          auth-redis:
            redisConfig: |
              requirepass ${{ secrets.PROD_REDIS_PASSWORD }}
              protected-mode no
            auth:
              password: "${{ secrets.PROD_REDIS_PASSWORD }}"

          wellness:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          wellness-worker:
            env:
              POSTGRES_USER: "${{ secrets.PROD_DB_USER }}"

          wellness-postgres:
            settings:
              superuserPassword:
                value: "${{ secrets.PROD_DB_PASSWORD }}"
            userDatabase:
              user:
                value: "${{ secrets.PROD_DB_USER }}"
              password:
                value: "${{ secrets.PROD_DB_PASSWORD }}"

          wellness-redis:
            redisConfig: |
              requirepass ${{ secrets.PROD_REDIS_PASSWORD }}
              protected-mode no
            auth:
              password: "${{ secrets.PROD_REDIS_PASSWORD }}"

          mail:
            env:
              EMAIL_CONFIRMATION_URL: "https://${{ secrets.PROD_HOST_URL }}/auth/confirm-email?token="

          secrets:
            auth:
              SECRET_KEY: "${{ secrets.PROD_AUTH_SECRET_KEY }}"
            mail:
              MAIL_USERNAME: "${{ secrets.PROD_MAIL_USERNAME }}"
              MAIL_PASSWORD: "${{ secrets.PROD_MAIL_PASSWORD }}"
              MAIL_HOSTNAME: "${{ secrets.PROD_MAIL_HOSTNAME }}"
              MAIL_PORT: "${{ secrets.PROD_MAIL_PORT }}"
            grafana:
              GF_SECURITY_ADMIN_USER: "${{ secrets.PROD_GRAFANA_USER }}"
              GF_SECURITY_ADMIN_PASSWORD: "${{ secrets.PROD_GRAFANA_PASSWORD }}"
          EOF

      - name: Rollback with Helm
        run: |
          helm upgrade --install mind-journal ./k8s -f ./k8s/values-prod.yaml -f ./k8s/values-secrets.yaml --namespace mind-journal --create-namespace
          kubectl rollout restart deployment -n mind-journal

      - name: Verify deployment
        run: kubectl rollout status deployment -n mind-journal --timeout=5m
